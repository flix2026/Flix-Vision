const cats = Object.keys(DATA);
let currentCat = cats[0];

const catsEl = document.getElementById('cats');
const gridEl = document.getElementById('grid');
const titleEl = document.getElementById('section-title');
const modal = document.getElementById('player-modal');
const iframe = document.getElementById('player-iframe');

// Build category buttons
cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = cat;
        renderGrid(cat);
    };
    catsEl.appendChild(btn);
});

function renderGrid(cat) {
    titleEl.textContent = cat;
    gridEl.innerHTML = '';
    (DATA[cat] || []).forEach(v => {
        const card = document.createElement('div');
        card.className = 'vcard';
        card.innerHTML = `<img src="${v.thumb}" alt="${v.title.replace(/"/g,'')}" loading="lazy" onerror="this.style.opacity=0.3">
            <div class="vcard-title">${v.title}</div>`;
        card.onclick = () => openPlayer(v.id);
        gridEl.appendChild(card);
    });
}

function openPlayer(id) {
    iframe.src = `https://www.xvideos.com/embedframe/${id}`;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
}

document.getElementById('close-player').onclick = closePlayer;
modal.addEventListener('click', e => { if(e.target === modal) closePlayer(); });

function closePlayer() {
    modal.classList.remove('active');
    iframe.src = '';
    document.body.style.overflow = '';
}

renderGrid(currentCat);
